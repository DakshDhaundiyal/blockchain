{% extends "base.html" %}

{% block title %}Sign In - TrustHarvest{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card card-custom shadow">
            <div class="card-header card-header-ag text-center py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-ag-primary w-100 py-2 fw-bold">Sign In</button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
